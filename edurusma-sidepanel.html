<html lang="tr">
<head>

<link rel="stylesheet" href="edurusma-sidepanel.css">

<body>

  <select id="sp-auto" title="Otomatik yenileme">

    <option value="15000">Oto: 15 sn</option>
    <option value="30000" selected>Oto: 30 sn</option>

<div id="sp-status" class="sp-status">Hazır</div>

<div class="sp-foot">Beesly Desk ailesindendir · satıra tıklayınca sayfada gösterilir</div>
