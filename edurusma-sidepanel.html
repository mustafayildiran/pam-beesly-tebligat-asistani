<!DOCTYPE html>

<head>

<link rel="stylesheet" href="edurusma-sidepanel.css">
</head>
<body>
<header class="sp-head">

    <span id="sp-zoom-val">85%</span>

<div id="sp-status" class="sp-status">Hazır</div>
<iframe id="sp-frame" src="https://avukat.uyap.gov.tr/durusma-takip" title="Duruşma Takip"></iframe>
<div class="sp-foot">Beesly Desk ailesindendir</div>
